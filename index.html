<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Projects | Mauricio Aguilar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: auto;
            padding: 32px 20px;
            background: #f7f8fa;
            color: #1f2937;
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 28px;
        }

        #repos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 18px;
        }

        .repo {
            padding: 20px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

            .repo h2 {
                margin-top: 0;
                font-size: 1.2rem;
            }

            .repo a {
                color: #0969da;
                text-decoration: none;
            }

            .repo p {
                min-height: 48px;
                color: #4b5563;
            }

        .meta {
            font-size: .9rem;
            color: #6b7280;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h1>My Software Projects</h1>
    <p class="subtitle">Repository catalog and technical work.</p>

    <main id="repos">Loading repositories...</main>

    <script>
    const username = "maguilar30";
    const reposContainer = document.getElementById("repos");

    fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`)
      .then(response => response.json())
      .then(repos => {
        const publicRepos = repos.filter(repo => !repo.fork);

        reposContainer.innerHTML = publicRepos.map(repo => `
          <article class="repo">
            <h2>
              <a href="${repo.html_url}" target="_blank" rel="noopener">
                ${repo.name}
              </a>
            </h2>
            <p>${repo.description || "No description available."}</p>
            <div class="meta">
              <span>⭐ ${repo.stargazers_count}</span>
              <span>${repo.language || "No language specified"}</span>
              <span>Updated: ${new Date(repo.updated_at).toLocaleDateString()}</span>
            </div>
          </article>
        `).join("");
      })
      .catch(() => {
        reposContainer.innerHTML = "<p>Unable to load repositories right now.</p>";
      });
    </script>
</body>
</html>
